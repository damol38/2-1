<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>통지표 점검기 v1</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  :root{
    --ink:#1f2a37; --sub:#5b6b7c; --line:#dfe6ee; --bg:#f3f6fa; --card:#ffffff;
    --navy:#1f4e79; --navy-soft:#e8f0f9;
    --red:#c0392b; --red-bg:#fdeceb;
    --amber:#9a6700; --amber-bg:#fff4d6;
    --teal:#0e7a6a; --teal-bg:#e2f4f0;
    --violet:#6b4fa0; --violet-bg:#efe9f9;
    --gray-bg:#eef1f5;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}
  .wrap{max-width:960px;margin:0 auto;padding:20px 16px 60px}
  header{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:6px}
  h1{font-size:22px;margin:0;color:var(--navy)}
  .ver{font-size:12px;color:var(--sub)}
  .privacy{font-size:12.5px;color:var(--sub);margin:0 0 16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}

  /* drop zone */
  #drop{border:2px dashed #b9c6d6;border-radius:10px;padding:34px 16px;text-align:center;color:var(--sub);cursor:pointer;transition:.15s;background:var(--card)}
  #drop.on{border-color:var(--navy);background:var(--navy-soft);color:var(--navy)}
  #drop strong{color:var(--navy)}
  #fileInput{display:none}
  #fileName{font-weight:700;color:var(--ink)}

  /* options */
  details.opts summary{cursor:pointer;font-weight:700;color:var(--navy);font-size:14px}
  .optgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:12px}
  @media(max-width:640px){.optgrid{grid-template-columns:1fr}}
  .opt label.head{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
  .opt textarea{width:100%;min-height:70px;border:1px solid var(--line);border-radius:8px;padding:8px;font-size:13px;font-family:inherit;resize:vertical}
  .checks{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:12px}
  .checks label{font-size:13.5px;display:flex;align-items:center;gap:6px;cursor:pointer}
  .hint{font-size:12px;color:var(--sub);margin-top:4px}

  button.run{display:block;width:100%;padding:13px;border:0;border-radius:10px;background:var(--navy);color:#fff;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
  button.run:disabled{background:#a9b8c9;cursor:not-allowed}
  #progress{font-size:13px;color:var(--sub);text-align:center;margin-top:8px;min-height:18px}

  /* summary */
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{padding:6px 12px;border-radius:20px;font-size:13px;font-weight:700;border:1px solid transparent}
  .chip.c-end{background:var(--red-bg);color:var(--red)}
  .chip.c-ban{background:var(--violet-bg);color:var(--violet)}
  .chip.c-dot{background:var(--amber-bg);color:var(--amber)}
  .chip.c-spc{background:var(--teal-bg);color:var(--teal)}
  .chip.c-emp{background:var(--gray-bg);color:var(--sub)}
  .chip.ok{background:#e5f5e9;color:#1e7a35}

  /* page results */
  .page{border:1px solid var(--line);border-radius:10px;margin-bottom:10px;background:var(--card);overflow:hidden}
  .page>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer;font-size:14px}
  .page>summary::-webkit-details-marker{display:none}
  .page>summary .pno{font-weight:800;color:var(--navy);min-width:52px}
  .page>summary .cnt{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
  .mini{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:12px}
  .mini.c-end{background:var(--red-bg);color:var(--red)}
  .mini.c-ban{background:var(--violet-bg);color:var(--violet)}
  .mini.c-dot{background:var(--amber-bg);color:var(--amber)}
  .mini.c-spc{background:var(--teal-bg);color:var(--teal)}
  .mini.c-emp{background:var(--gray-bg);color:var(--sub)}
  .mini.ok{background:#e5f5e9;color:#1e7a35}
  .issues{padding:4px 14px 12px;border-top:1px solid var(--line)}
  .issue{display:flex;gap:10px;padding:9px 0;border-bottom:1px dashed #e8edf3;font-size:13.5px}
  .issue:last-child{border-bottom:0}
  .tag{flex:0 0 auto;font-size:11.5px;font-weight:800;padding:2px 8px;border-radius:6px;height:fit-content;margin-top:2px}
  .tag.c-end{background:var(--red-bg);color:var(--red)}
  .tag.c-ban{background:var(--violet-bg);color:var(--violet)}
  .tag.c-dot{background:var(--amber-bg);color:var(--amber)}
  .tag.c-spc{background:var(--teal-bg);color:var(--teal)}
  .tag.c-emp{background:var(--gray-bg);color:var(--sub)}
  .issue .txt mark{background:#ffe08a;color:inherit;padding:0 2px;border-radius:3px;font-weight:700}
  .issue .why{color:var(--sub);font-size:12px;margin-top:2px}
  .rawBtn{font-size:12px;color:var(--navy);background:none;border:1px solid var(--line);border-radius:6px;padding:3px 10px;cursor:pointer;font-family:inherit;margin-top:8px}
  .raw{display:none;white-space:pre-wrap;font-size:12px;background:var(--gray-bg);border-radius:8px;padding:10px;margin-top:8px;max-height:260px;overflow:auto}
  .raw.show{display:block}
  #emptyResult{text-align:center;color:var(--sub);padding:20px 0;font-size:14px}
  .footNote{font-size:12px;color:var(--sub);margin-top:14px}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>통지표 점검기</h1><span class="ver">v1.0 · NEIS PDF용</span></header>
  <p class="privacy">🔒 모든 검사는 이 브라우저 안에서만 실행됩니다. PDF가 인터넷으로 전송되지 않습니다.</p>

  <div id="drop" class="card">
    <input type="file" id="fileInput" accept="application/pdf">
    <div id="dropText">여기에 통지표 PDF를 끌어다 놓거나 <strong>클릭해서 선택</strong>하세요</div>
  </div>

  <div class="card">
    <details class="opts" open>
      <summary>점검 항목 · 설정</summary>
      <div class="checks">
        <label><input type="checkbox" id="ckEnd" checked> 종결어미 통일(명사형 ~함/~임/~음)</label>
        <label><input type="checkbox" id="ckBan" checked> 금지어·부적절 표현</label>
        <label><input type="checkbox" id="ckDot" checked> 마침표</label>
        <label><input type="checkbox" id="ckSpc" checked> 띄어쓰기(패턴 기반)</label>
        <label><input type="checkbox" id="ckEmp" checked> 빈칸·내용 부족</label>
      </div>
      <div class="optgrid">
        <div class="opt">
          <label class="head" for="banList">금지어 목록 (쉼표로 구분, 자유롭게 수정)</label>
          <textarea id="banList">산만, 주의가 요구, 문제행동, 떨어짐, 게으, 이기적, 폭력, 부진, 열등, 미흡</textarea>
          <div class="hint">단어 일부만 적어도 포함된 문장을 모두 찾습니다.</div>
        </div>
        <div class="opt">
          <label class="head" for="minChars">‘내용 부족’ 기준 글자 수 (페이지당)</label>
          <textarea id="minChars" style="min-height:38px">80</textarea>
          <div class="hint">서술 내용이 이 글자 수보다 적은 페이지를 표시합니다.</div>
        </div>
      </div>
    </details>
  </div>

  <button class="run" id="runBtn" disabled>점검 시작</button>
  <div id="progress"></div>

  <div id="summaryCard" class="card" style="display:none">
    <div class="chips" id="chips"></div>
  </div>
  <div id="results"></div>

  <p class="footNote">※ PDF에서 글자를 추출하는 과정에서 줄바꿈·띄어쓰기가 원본과 다르게 읽힐 수 있습니다. 특히 띄어쓰기 항목은 참고용으로 보시고, 각 페이지의 「추출된 원문 보기」로 추출 상태를 확인해 주세요.</p>
</div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const $ = id => document.getElementById(id);
let pdfFile = null;

/* ---------- 파일 선택 ---------- */
const drop = $("drop"), fi = $("fileInput");
drop.addEventListener("click", () => fi.click());
["dragover","dragenter"].forEach(ev => drop.addEventListener(ev, e => {e.preventDefault(); drop.classList.add("on");}));
["dragleave","drop"].forEach(ev => drop.addEventListener(ev, e => {e.preventDefault(); drop.classList.remove("on");}));
drop.addEventListener("drop", e => { if(e.dataTransfer.files[0]) setFile(e.dataTransfer.files[0]); });
fi.addEventListener("change", () => { if(fi.files[0]) setFile(fi.files[0]); });
function setFile(f){
  if(f.type !== "application/pdf" && !f.name.toLowerCase().endsWith(".pdf")){
    $("dropText").innerHTML = "PDF 파일만 열 수 있습니다. 다시 선택해 주세요."; return;
  }
  pdfFile = f;
  $("dropText").innerHTML = "선택된 파일: <span id='fileName'>" + escapeHtml(f.name) + "</span><br><span style='font-size:12px'>다른 파일을 선택하려면 다시 클릭</span>";
  $("runBtn").disabled = false;
}

/* ---------- 한글 유틸 ---------- */
function lastHangulJong(ch){ // 종성 인덱스 (없으면 -1, 한글 아니면 -2)
  const c = ch.charCodeAt(0) - 0xAC00;
  if(c < 0 || c > 11171) return -2;
  return c % 28; // 16 == ㅁ
}
function escapeHtml(s){ return s.replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); }
function markHtml(sentence, part){
  const s = escapeHtml(sentence);
  if(!part) return s;
  const p = escapeHtml(part);
  const i = s.indexOf(p);
  if(i < 0) return s;
  return s.slice(0,i) + "<mark>" + p + "</mark>" + s.slice(i + p.length);
}

/* ---------- PDF 텍스트 추출 (줄 재구성) ---------- */
async function extractPages(file){
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({data: buf}).promise;
  const pages = [];
  for(let p = 1; p <= pdf.numPages; p++){
    $("progress").textContent = `텍스트 추출 중… ${p}/${pdf.numPages} 페이지`;
    const page = await pdf.getPage(p);
    const tc = await page.getTextContent();
    // y좌표 기준으로 줄 묶기
    const items = tc.items.filter(it => it.str.trim().length > 0)
      .map(it => ({str: it.str, x: it.transform[4], y: it.transform[5], h: it.height || 10}));
    items.sort((a,b) => (b.y - a.y) || (a.x - b.x));
    const lines = [];
    let cur = null;
    for(const it of items){
      if(cur && Math.abs(cur.y - it.y) < Math.max(3, it.h * 0.5)){
        // 같은 줄: x 간격이 넓으면 공백 삽입
        const gap = it.x - cur.xEnd;
        cur.text += (gap > it.h * 0.6 ? " " : "") + it.str;
        cur.xEnd = it.x + it.str.length * it.h * 0.55;
      }else{
        if(cur) lines.push(cur.text);
        cur = {y: it.y, text: it.str, xEnd: it.x + it.str.length * it.h * 0.55};
      }
    }
    if(cur) lines.push(cur.text);
    pages.push(lines.join("\n"));
  }
  return pages;
}

/* ---------- 문장 분리 ---------- */
function splitSentences(pageText){
  // 줄바꿈은 공백으로 잇되, 문장 끝(.!?) 뒤 줄바꿈은 문장 경계로
  const flat = pageText.replace(/\n+/g, "\n");
  const out = [];
  let buf = "";
  for(const line of flat.split("\n")){
    buf += (buf ? " " : "") + line.trim();
    // 문장부호 기준 분리
    let m;
    const re = /[^.!?]*[.!?]+/g;
    let consumed = 0;
    while((m = re.exec(buf)) !== null){
      out.push({text: m[0].trim(), closed: true});
      consumed = re.lastIndex;
    }
    buf = buf.slice(consumed);
  }
  if(buf.trim()) out.push({text: buf.trim(), closed: false});
  return out.filter(s => s.text.length > 0);
}
function isNarrative(s){
  // 서술문으로 볼 만한 문장: 한글 8자 이상 + 공백 포함
  const hangul = (s.match(/[가-힣]/g) || []).length;
  return hangul >= 8 && /\s/.test(s.trim());
}

/* ---------- 점검 ---------- */
const CAT = {
  end:{label:"종결어미", cls:"c-end"},
  ban:{label:"금지어",   cls:"c-ban"},
  dot:{label:"마침표",   cls:"c-dot"},
  spc:{label:"띄어쓰기", cls:"c-spc"},
  emp:{label:"내용부족", cls:"c-emp"},
};

const SPACING_PATTERNS = [
  {re:/[가-힣](할수|볼수|될수|갈수|올수)(있|없|밖)/, why:"의존명사 ‘수’ 띄어쓰기 (예: 할 수 있다)"},
  {re:/(하는|되는|한|할|인|있는|없는)것(이|을|은|도|과|처럼)/, why:"의존명사 ‘것’ 띄어쓰기 (예: 하는 것이)"},
  {re:/몇일/, why:"‘몇일’ → ‘며칠’"},
  {re:/[가-힣]\s{2,}[가-힣]/, why:"이중 공백"},
  {re:/[가-힣]\s+[.,]/, why:"문장부호 앞 공백"},
];

function checkPage(text, opts){
  const issues = [];
  const sentences = splitSentences(text);
  const narrative = sentences.filter(s => isNarrative(s.text));

  for(const s of narrative){
    const t = s.text;
    // 끝 문장부호·따옴표 제거한 마지막 글자
    const core = t.replace(/[\s.。!?'"’”)\]]+$/g, "");
    const lastCh = core.slice(-1);

    if(opts.end){
      const jong = lastHangulJong(lastCh);
      if(jong !== -2 && jong !== 16){ // 한글인데 ㅁ받침이 아님
        issues.push({cat:"end", sent:t, part: core.split(/\s/).pop(),
          why:"명사형(~함/~임/~음)으로 끝나지 않는 문장"});
      }
    }
    if(opts.dot){
      if(!s.closed && lastHangulJong(lastCh) === 16){
        issues.push({cat:"dot", sent:t, part: core.split(/\s/).pop(), why:"마침표 누락 의심"});
      }
      if(/\.\./.test(t)) issues.push({cat:"dot", sent:t, part:"..", why:"마침표 중복"});
    }
    if(opts.ban){
      for(const w of opts.banWords){
        if(w && t.includes(w)) issues.push({cat:"ban", sent:t, part:w, why:"금지어 목록에 포함된 표현"});
      }
    }
    if(opts.spc){
      for(const p of SPACING_PATTERNS){
        const m = t.match(p.re);
        if(m) issues.push({cat:"spc", sent:t, part:m[0].trim(), why:p.why});
      }
    }
  }

  const narrativeChars = narrative.reduce((a,s) => a + (s.text.match(/[가-힣]/g)||[]).length, 0);
  if(opts.emp && narrativeChars < opts.minChars){
    issues.push({cat:"emp", sent:`이 페이지의 서술 내용이 ${narrativeChars}자입니다 (기준 ${opts.minChars}자).`, part:null, why:"미입력·빈칸 여부를 확인해 주세요"});
  }
  return issues;
}

/* ---------- 실행 & 렌더 ---------- */
$("runBtn").addEventListener("click", async () => {
  if(!pdfFile) return;
  $("runBtn").disabled = true;
  $("results").innerHTML = "";
  $("summaryCard").style.display = "none";
  try{
    const pages = await extractPages(pdfFile);
    $("progress").textContent = "점검 중…";
    const opts = {
      end: $("ckEnd").checked, ban: $("ckBan").checked, dot: $("ckDot").checked,
      spc: $("ckSpc").checked, emp: $("ckEmp").checked,
      banWords: $("banList").value.split(",").map(s => s.trim()).filter(Boolean),
      minChars: parseInt($("minChars").value, 10) || 80,
    };
    const perPage = pages.map(t => checkPage(t, opts));
    render(pages, perPage);
    $("progress").textContent = `완료 — 총 ${pages.length}페이지 점검`;
  }catch(err){
    console.error(err);
    $("progress").textContent = "오류: PDF를 읽지 못했습니다. 파일이 암호화되어 있거나 손상되었을 수 있습니다.";
  }finally{
    $("runBtn").disabled = false;
  }
});

function render(pages, perPage){
  // 요약
  const totals = {};
  perPage.flat().forEach(i => totals[i.cat] = (totals[i.cat]||0) + 1);
  const chips = $("chips");
  chips.innerHTML = "";
  const totalCount = perPage.flat().length;
  if(totalCount === 0){
    chips.innerHTML = `<span class="chip ok">발견된 문제 없음 🎉</span>`;
  }else{
    for(const k of Object.keys(CAT)){
      if(totals[k]) chips.innerHTML += `<span class="chip ${CAT[k].cls}">${CAT[k].label} ${totals[k]}건</span>`;
    }
  }
  $("summaryCard").style.display = "block";

  // 페이지별
  const res = $("results");
  pages.forEach((text, idx) => {
    const issues = perPage[idx];
    const d = document.createElement("details");
    d.className = "page";
    if(issues.length) d.open = false;
    const counts = {};
    issues.forEach(i => counts[i.cat] = (counts[i.cat]||0)+1);
    let minis = Object.keys(counts).map(k => `<span class="mini ${CAT[k].cls}">${CAT[k].label} ${counts[k]}</span>`).join("");
    if(!issues.length) minis = `<span class="mini ok">이상 없음</span>`;
    d.innerHTML = `
      <summary><span class="pno">${idx+1}쪽</span><span class="cnt">${minis}</span></summary>
      <div class="issues">
        ${issues.map(i => `
          <div class="issue">
            <span class="tag ${CAT[i.cat].cls}">${CAT[i.cat].label}</span>
            <div><div class="txt">${markHtml(i.sent, i.part)}</div><div class="why">${escapeHtml(i.why)}</div></div>
          </div>`).join("") || `<div class="issue"><div class="txt" style="color:var(--sub)">발견된 문제가 없습니다.</div></div>`}
        <button class="rawBtn">추출된 원문 보기</button>
        <div class="raw">${escapeHtml(text) || "(추출된 텍스트 없음 — 스캔본 PDF일 수 있습니다)"}</div>
      </div>`;
    d.querySelector(".rawBtn").addEventListener("click", e => {
      e.preventDefault();
      d.querySelector(".raw").classList.toggle("show");
    });
    res.appendChild(d);
  });
}
</script>
</body>
</html>
